<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>智能简历筛选</title>
<style>
:root{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;color:#19332d;background:#f3f6f3;font-synthesis:none}*{box-sizing:border-box}body{margin:0}header{height:80px;padding:0 6%;border-bottom:1px solid #dce5de;display:flex;align-items:center;justify-content:space-between;background:#fafcf9}.brand{display:flex;gap:12px;align-items:center;font-weight:700}.mark{background:#1e5747;color:white;border-radius:11px;padding:9px 12px;font-size:20px}.tag{font-size:12px;color:#557466;letter-spacing:2px}main{max-width:1080px;margin:auto;padding:64px 28px 40px}.eyebrow{font-size:12px;letter-spacing:3px;color:#698175;margin-bottom:17px}h1{font-size:clamp(30px,5vw,46px);letter-spacing:-1px;line-height:1.3;margin:0 0 16px}.intro{color:#6b7b72;font-size:15px;line-height:1.9;margin-bottom:38px}.layout{display:grid;grid-template-columns:1.15fr 1fr;gap:24px;align-items:start}.card{background:#fff;border:1px solid #dce6de;border-radius:20px;padding:28px;box-shadow:0 8px 32px #23433204}.section-top{display:flex;align-items:center;gap:10px;margin-bottom:26px}.number{font-size:11px;color:#698175;border:1px solid #dce6de;padding:5px 7px;border-radius:6px}h2{font-size:17px;margin:0}label{display:block;font-size:14px;font-weight:600;margin-bottom:10px}textarea{resize:vertical;min-height:240px;width:100%;border:1px solid #d7e1da;border-radius:12px;padding:16px;font:inherit;font-size:14px;line-height:1.8;color:#19332d;background:#fcfdfb}textarea:focus{outline:2px solid #528673;outline-offset:2px}textarea::placeholder{color:#9aa79e}.meta{display:flex;justify-content:space-between;margin:10px 0 24px;color:#86958b;font-size:12px}button{width:100%;border:0;border-radius:11px;padding:15px;font:inherit;font-size:15px;font-weight:600;background:#215846;color:#fff;cursor:pointer}button:hover{background:#174535}button:disabled{opacity:.65;cursor:wait}.note{text-align:center;font-size:12px;color:#85938b;margin:16px 0 0}.empty{min-height:318px;display:flex;align-items:center;justify-content:center;flex-direction:column;text-align:center;color:#84958a}.symbol{font-size:28px;background:#f0f5ef;width:64px;height:64px;border-radius:18px;display:grid;place-items:center;margin-bottom:20px}.empty strong{color:#50695c;font-size:15px}.empty p{font-size:13px;line-height:1.8;max-width:240px}.result{padding:22px;border:1px solid;border-radius:12px}.interview{background:#edf8f0;border-color:#a3d0ad;color:#205b34}.review{background:#fff6e8;border-color:#eac68b;color:#86531e}.low{background:#fff0ef;border-color:#e8b1ac;color:#983d35}.result h3{font-size:19px;margin:0 0 20px}.result h4{font-size:12px;opacity:.7;margin:20px 0 8px}.content{white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.8;font-size:14px;margin:0}.error{margin:18px 0 0;color:#a33b32;font-size:14px;line-height:1.7}footer{display:flex;justify-content:space-between;gap:20px;border-top:1px solid #dde6df;padding-top:22px;margin-top:40px;font-size:12px;color:#839188}.dot{display:inline-block;width:6px;height:6px;background:#6f967d;border-radius:50%;margin-right:6px}[hidden]{display:none!important}@media(max-width:700px){header{height:66px;padding:0 22px}.tag{display:none}main{padding:36px 18px}.layout{grid-template-columns:1fr}.card{padding:22px}.empty{min-height:180px}.intro{margin-bottom:26px}footer{flex-direction:column;gap:8px}}
</style>
</head>
<body>
<header><div class="brand"><span class="mark" aria-hidden="true">▤</span>智能简历筛选</div><span class="tag">RECRUITMENT ASSISTANT</span></header>
<main><div class="eyebrow">让每一份经历，都被认真看见</div><h1>发现人才，从一份简历开始。</h1><p class="intro">输入候选人经历，获取岗位匹配判断与面试追问。<br>帮助你梳理信息，为下一步沟通提供参考。</p>
<div class="layout"><section class="card"><div class="section-top"><span class="number">01</span><h2>候选人信息</h2></div>
<form id="form"><label for="description">简历描述</label><textarea id="description" name="job_description" required maxlength="10000" placeholder="粘贴候选人的工作经历、项目经验和个人能力……"></textarea><div class="meta"><span>填写清晰的经历，有助于判断匹配程度</span><span id="count">0 / 10000</span></div><button id="submit" type="submit">筛选结果 <span aria-hidden="true">↗</span></button><p class="note">结果供招聘人员参考，最终决定由人工作出</p></form><p id="error" class="error" role="alert" hidden></p></section>
<section class="card" aria-labelledby="result-heading"><div class="section-top"><span class="number">02</span><h2 id="result-heading">筛选结果</h2></div><div id="output" aria-live="polite"><div class="empty"><div class="symbol" aria-hidden="true">⌕</div><strong>等待一份新的简历</strong><p>提交后，这里将展示岗位匹配结果，以及建议追问或待核实的信息。</p></div></div></section></div>
<footer><span><span class="dot"></span>由 Dify 工作流驱动</span><span>认真理解经历 · 辅助招聘判断</span></footer></main>
<script>
const form=document.querySelector('#form'),input=document.querySelector('#description'),button=document.querySelector('#submit'),output=document.querySelector('#output'),error=document.querySelector('#error');
input.addEventListener('input',()=>document.querySelector('#count').textContent=`${Array.from(input.value).length} / 10000`);
function paragraph(parent,label,text){const h=document.createElement('h4');h.textContent=label;const p=document.createElement('p');p.className='content';p.textContent=text;parent.append(h,p)}
form.addEventListener('submit',async event=>{event.preventDefault();const draft=input.value.trim();if(!draft){error.textContent='请先填写简历描述。';error.hidden=false;return}button.disabled=true;input.disabled=true;button.textContent='筛选中…';error.hidden=true;output.setAttribute('aria-busy','true');output.textContent='正在分析候选人经历，请稍候…';const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),60000);try{const response=await fetch('/api/generate',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({job_description:draft}),signal:controller.signal});let result;try{result=await response.json()}catch{throw new Error('服务暂时不可用，请再试一次。')}if(!response.ok)throw new Error(result.error||'筛选未完成，请再试一次。');if(!['interview','review','low'].includes(result.type))throw new Error('筛选结果格式异常，请再试一次。');const box=document.createElement('div');box.className=`result ${result.type}`;const title=document.createElement('h3');title.textContent={interview:'建议面试',review:'需要人工复核',low:'不满足岗位要求'}[result.type];box.append(title);if(result.type==='interview'){if(result.text)paragraph(box,'筛选结论',result.text);if(result.question)paragraph(box,'面试问题',result.question)}else{paragraph(box,'判断结果',result.verdict)}output.replaceChildren(box)}catch(e){output.textContent='本次未获得筛选结果。';error.textContent=controller.signal.aborted?'请再试一次。':e.message==='Failed to fetch'?'暂时无法连接服务，请再试一次。':e.message;error.hidden=false}finally{clearTimeout(timer);button.disabled=false;input.disabled=false;button.textContent='筛选结果 ↗';output.removeAttribute('aria-busy')}});
</script></body></html>
