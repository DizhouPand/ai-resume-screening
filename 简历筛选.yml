        model_selector: null
        prompt_template:
        - id: 0d1df11e-e304-426e-b762-28942ce0b7fb
          role: system
          text: '**职位要求：**本科及以上，3年以上产品经验，熟悉运输、仓储或配送业务；有AI产品落地经验，理解大模型、RAG及Agent，能独立完成需求分析、产品设计和项目交付。

            **核心能力：**识别业务痛点，设计AI方案，建立效果评估体系，以数据衡量降本增效，推动跨团队协作。

            **加分项：**有TMS/WMS经验；落地过智能调度、物流客服或异常处理产品；掌握SQL、Python或原型搭建工具


            请判断下面这条简历内容是否命中以下任一红线：

            1、明确不足3年产品经验，且该年限是已确认的硬性要求。

            2、经历仅涉及传统产品，明确没有 AI 产品落地经历；仅有课程或演示项目，尚无项目交付经验。


            判断类别的定义：

            - 匹配程度低：简历中的明确信息显示，与一项或多项关键岗位要求存在实质差距。例如：明确不足3年产品经验，且该年限是已确认的硬性要求；经历仅涉及传统产品，明确没有
            AI 产品落地经历；仅有课程或演示项目，尚无项目交付经验；职责主要是辅助执行，明确缺少独立完成需求、设计和交付的经历。需列明具体差距，供 HR
            复核。

            - 待确定：有相关经历和匹配潜力，但关键要求缺少证据、表述模糊或存在需要核实的信息。例如：写了“参与 AI 产品”，但没说明是否上线、个人职责或效果；有供应链经历，但是否涉及运输、仓储、配送不清楚；提到
            RAG、Agent，却没有体现理解深度；项目成果缺少评估口径。简历未提及，不直接判为不满足。

            - 建议面试：简历对关键岗位要求提供了明确证据，值得通过面试进一步验，正例：本科及以上、3年以上产品经验；有运输、仓储或配送相关经历；有已落地的
            AI 产品项目，能说明大模型、RAG、Agent 的理解或应用


            加分项不作为门槛：没有 TMS/WMS、智能调度、物流客服、异常处理或 SQL/Python 经验，不单独导致降档；有这些经历，也不能自动抵消关键要求的差距。

            术语不等于能力证据：仅列出“大模型、RAG、Agent”，不能认定已掌握；需要项目中的使用方式、职责或技术理解作为依据。

            每项判断附证据：输出“岗位要求＋简历原文＋满足／信息不足／明确不满足”，再汇总档位。不得编造经历或根据无关个人信息推断能力。


            简历内容：{{#1792769168723.text#}}

            只回答下面三个词之一：建议面试/待确定/匹配程度低。

            回答待确定时，后面需加上输出：，需人工审核。其他两种回答不需要出现其他任何字。'
